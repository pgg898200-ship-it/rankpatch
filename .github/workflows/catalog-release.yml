name: Build and release RankPatch 0.2.0
on:
  push:
    branches: [main]
    paths: ['release/0.2.0.md']
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64, target: manylinux_x86_64}
          - {runner: windows-2022, arch: AMD64, target: win_amd64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cibuildwheel==4.3.5
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp311-${{ matrix.target }} cp312-${{ matrix.target }} cp313-${{ matrix.target }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_COMMAND: 'python "{project}/tests/test_python.py"'
      - uses: actions/upload-artifact@v4
        with:
          name: core-wheels-${{ matrix.target }}
          path: wheelhouse/rankpatch-0.2.0-*.whl
          if-no-files-found: error
          retention-days: 1
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          c++ -std=c++17 -O2 tests/test.cpp -o /tmp/rankpatch-test
          /tmp/rankpatch-test
          python -m pip install build
          python -m build --sdist
          python -m pip install dist/rankpatch-0.2.0.tar.gz
          python tests/test_python.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-source
          path: dist/rankpatch-0.2.0.tar.gz
          retention-days: 1
  publish:
    needs: [source, wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          merge-multiple: true
          path: dist
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheels=(dist/rankpatch-0.2.0-*.whl)
          test "${#wheels[@]}" -eq 6
          gh release create v0.2.0 --target "$GITHUB_SHA" --title 'RankPatch 0.2.0' --notes-file release/0.2.0.md "${wheels[@]}" dist/rankpatch-0.2.0.tar.gz include/rankpatch.hpp include/rankpatch_steady.hpp
  apple-silicon:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cibuildwheel==4.3.5
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64
          CIBW_ARCHS: arm64
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_COMMAND: 'python "{project}/tests/test_python.py"'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macosx_arm64
          path: wheelhouse/rankpatch-0.2.0-*.whl
          if-no-files-found: error
          retention-days: 1
  attach-apple-silicon:
    needs: [publish, apple-silicon]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macosx_arm64
          path: dist
      - name: Attach tested Apple Silicon wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0 --jq .object.sha)" = "$GITHUB_SHA"
          wheels=(dist/rankpatch-0.2.0-*-macosx_*_arm64.whl)
          test "${#wheels[@]}" -eq 3
          gh release upload v0.2.0 --repo "$GITHUB_REPOSITORY" "${wheels[@]}"
